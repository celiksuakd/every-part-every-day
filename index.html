<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Value Stream Game – Exercise 2: current state map & EPE</title>
<meta name="description" content="Browser game for lean value stream mapping, exercise 2: finish the current state map of family B (takt time, inventory days, timeline, icons) and find the EPE of every stage and of the plant.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a production planner's board. Every stage is one horizontal "day bar" of 900 minutes;
   the game is about what fits in that bar once production, breakdowns and set-ups are paid for. */
:root{
  --paper:#EFEDE6; --card:#FAF9F5; --ink:#1D2026; --muted:#5E6470; --line:#CFCBC0;
  --prod:#2F5A85; --down:#8D929B; --setup:#C4861A; --free:#DCE9D9; --other:#E1DED6;
  --accent:#2F5A85; --bad:#B23A2B; --good:#2E7A4E; --warn:#C4861A;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#121417; --card:#1A1D22; --ink:#E4E6EA; --muted:#9AA1AD; --line:#2E333B;
  --prod:#6E9BC9; --down:#6B717B; --setup:#E0A440; --free:#22382A; --other:#262A30;
  --accent:#8DB5DD; --bad:#E57A66; --good:#6BC08F; --warn:#E0A440; color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-inline:20px;padding-block:28px 56px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.05}
h2{font-size:1.3rem} h3{font-size:1.02rem}
p{margin:0}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:22px}
.score{font-family:var(--f-mono);font-size:.9rem;border:1.5px solid var(--ink);border-radius:20px;padding:4px 12px;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:22px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:.75rem;font-family:var(--f-mono);padding:3px 9px;border-radius:12px;border:1px solid var(--line);color:var(--muted)}
.steps span.on{border-color:var(--ink);color:var(--ink);font-weight:500}
.steps span.done{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.params{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.params div{background:var(--card);padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.params b{font-family:var(--f-mono);font-size:1.1rem;font-weight:500}
.params small{color:var(--muted);font-size:.76rem}
.btn{font:600 .95rem var(--f-body);border-radius:5px;padding:10px 16px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn.primary:hover:not(:disabled){filter:brightness(1.1);background:var(--accent)}
.btn.small{padding:6px 11px;font-size:.82rem;font-weight:500}
.btn.on{background:var(--ink);color:var(--paper)}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--setup);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.formula{font-family:var(--f-mono);font-size:.85rem;background:var(--paper);border:1px dashed var(--line);border-radius:4px;padding:10px 12px;overflow-x:auto;line-height:1.7}
.msg{border-left:3px solid var(--line);padding:8px 12px;background:var(--paper);font-size:.9rem}
.msg.ok{border-color:var(--good)} .msg.no{border-color:var(--bad)} .msg.info{border-color:var(--setup)}
.msg b.ok{color:var(--good)} .msg b.no{color:var(--bad)}
.ask{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ask input{font:500 1rem var(--f-mono);width:8.5em;padding:8px 10px;border:1.5px solid var(--ink);border-radius:5px;background:var(--card);color:var(--ink)}
.ask input.ok{border-color:var(--good)} .ask input.no{border-color:var(--bad)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:right;padding:7px 9px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
td.hl{color:var(--bad);font-weight:600} td.ok{color:var(--good);font-weight:600}
/* day bars */
.bars{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.barrow{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:10px;align-items:center}
.barrow .nm{font-weight:600;font-size:.88rem;line-height:1.2}
.barrow .nm small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
.bar{position:relative;height:26px;display:flex;border-radius:3px;background:var(--card)}
.bar i{height:100%;display:block;transition:width .35s ease;position:relative;overflow:hidden}
.bar i em{font-style:normal;font-size:.62rem;font-family:var(--f-mono);color:var(--muted);position:absolute;left:5px;top:50%;transform:translateY(-50%);white-space:nowrap}
.bar i.prod{background:var(--prod)}
.bar i.down{background:repeating-linear-gradient(45deg,var(--down) 0 3px,transparent 3px 7px);border-block:1px solid var(--down)}
.bar i.setup{background:var(--setup)}
.bar i.free{background:var(--free);border-block:1px solid var(--line)}
.bar i.over{background:repeating-linear-gradient(45deg,var(--bad) 0 4px,transparent 4px 8px);border:1.5px solid var(--bad)}
.bar i.other{background:repeating-linear-gradient(-45deg,var(--other) 0 4px,transparent 4px 8px);border-block:1px solid var(--line)}
.bar .mk{position:absolute;top:-5px;bottom:-5px;border-left:2px solid var(--ink)}
.bar .mk.fam{border-left:2px dashed var(--ink)}
.bar .mk span{position:absolute;top:-15px;right:4px;font-size:.62rem;font-family:var(--f-mono);white-space:nowrap;color:var(--muted)}
.bar .mk.fam span{right:auto;left:4px}
@media (max-width:620px){.barrow{grid-template-columns:minmax(0,1fr);gap:4px}.barrow .bar{margin-top:14px}.barnote{grid-column:1!important;margin-top:0!important}}
.barnote{grid-column:2;font-size:.76rem;color:var(--muted);font-family:var(--f-mono);margin-top:-6px}
.barnote b.no{color:var(--bad)} .barnote b.ok{color:var(--good)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:11px;border-radius:2px;display:inline-block}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pick button{text-align:left;font:500 .9rem var(--f-body);padding:12px;border-radius:6px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.pick button:hover{border-color:var(--ink)}
.pick button.no{border-color:var(--bad);opacity:.65}
.pick button.ok{border-color:var(--good);background:var(--free)}
.pick button small{display:block;color:var(--muted);font-size:.75rem;margin-top:2px}
/* SMED workshop */
.el{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.el:last-child{border-bottom:0}
.el .t{font-family:var(--f-mono);font-size:.9rem}
.el .t s{color:var(--muted)}
.tag{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:10px;font-weight:600;margin-left:6px;white-space:nowrap}
.tag.int{background:var(--setup);color:#fff} .tag.ext{background:var(--free);color:var(--good);border:1px solid var(--good)}
.el .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.meter{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.meter div{border-top:3px solid var(--line);padding-top:6px}
.meter b{font-family:var(--f-mono);font-size:1.25rem;font-weight:500;display:block}
.meter small{font-size:.74rem;color:var(--muted)}
.meter .ok{color:var(--good)} .meter .no{color:var(--bad)}
/* week grid */
.week{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:4px 8px;align-items:center;font-size:.75rem;font-family:var(--f-mono);color:var(--muted)}
.cells{display:grid;grid-template-columns:repeat(68,minmax(0,1fr));gap:1px}
.cells i{height:14px;background:var(--other);border-radius:1px}
.cells i.on{background:var(--prod)}
.mc{display:flex;flex-direction:column;gap:8px}
.mc button{text-align:left;font:500 .92rem var(--f-body);padding:11px 13px;border-radius:6px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.mc button:hover{border-color:var(--ink)}
.mc button.no{border-color:var(--bad);opacity:.65} .mc button.ok{border-color:var(--good);background:var(--free)}
.card h3{font-size:1.2rem}
.card .meta{font-size:.82rem;color:var(--muted)}
label.sl{display:flex;flex-direction:column;gap:3px;font-size:.8rem}
label.sl .row{display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--accent)}
select{font:500 .9rem var(--f-body);padding:7px 10px;border-radius:5px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink)}
.labgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.labgrid .panel{padding:12px 14px}
/* current state map (SVG) */
.mapwrap{overflow-x:auto;padding:10px 12px}
.vsm{display:block;width:100%;min-width:760px;height:auto}
.vsm .mt{font:9.5px var(--f-body);fill:var(--ink)}
.vsm .mt.b{font-weight:600} .vsm .mt.s{font-size:8.5px} .vsm .mt.xs{font-size:7px;fill:var(--muted)} .vsm .mt.i{font-style:italic}
.vsm .halo{paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.vsm .mbox{fill:var(--card);stroke:var(--ink);stroke-width:1.2}
.vsm .mfill{fill:var(--ink)}
.vsm .ml{fill:none;stroke:var(--ink);stroke-width:1.1}
.vsm .mthin{stroke:var(--ink);stroke-width:.5}
.vsm .mship{fill:none;stroke:var(--ink);stroke-width:7;stroke-linejoin:round}
.vsm .mship2{fill:none;stroke:var(--card);stroke-width:4.2;stroke-linejoin:round}
.vsm .mstair{fill:none;stroke:var(--ink);stroke-width:1.4}
.vsm .hit{fill:transparent;stroke:none}
.vsm .hit.pass{pointer-events:none}
.vsm .hot.clk{cursor:pointer}
.vsm .hot.clk:hover .hit{stroke:var(--setup);stroke-width:1.5;stroke-dasharray:3 3}
.vsm .hot.sel .hit{stroke:var(--setup);stroke-width:2.5;stroke-dasharray:6 3}
.vsm .hot.ok .hit{stroke:var(--good);stroke-width:2}
.vsm .hot.no .hit{stroke:var(--bad);stroke-width:2.5}
.vsm .hot:focus{outline:none} .vsm .hot:focus-visible .hit{stroke:var(--setup);stroke-width:3}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{text-align:left;font:500 .8rem var(--f-body);padding:7px 10px;border-radius:6px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip small{display:block;color:var(--muted);font-size:.72rem;font-weight:400}
.chip:hover,.chip.on{border-color:var(--ink)} .chip.ed{border-left:4px solid var(--setup)}
.mc button.on{border-color:var(--ink)}
.debrief p+p{margin-top:2px}
footer{margin-top:40px;font-size:.78rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ---------------------------------------------------------------- data */
const T_MIN = 2 * (8 * 60 - 30);           // 900 min of available time per day (2 shifts, 30 min break each)
const CASE_A = { key:'A', D:450, n:68, label:'Family A – 68 variants', stages:[
  { name:'Machining', ct:95, co:10, a:.95, share:1, units:1 },
  { name:'Heat treatment', ct:80, co:0, a:.95, share:1, units:1 },
  { name:'Assembly', ct:105, co:0, a:1, share:1, units:1 } ]};
const CASE_B = { key:'B', D:1800, n:6, label:'Family B – 6 variants', stages:[
  { name:'Press', ct:4, co:120, a:.80, share:.60, units:1, unit:'foil' },
  { name:'Cutter', ct:10, co:15, a:1, share:.70, units:2, unit:'pipe' },
  { name:'Welding', ct:10, co:0, a:1, share:1, units:1 },
  { name:'Drilling', ct:12, co:100, a:.95, share:1, units:1 },
  { name:'Finishing', ct:23, co:0, a:1, share:1, units:1 } ]};

const SMED = [
  { id:'fetch',  name:'Fetch the next fixture and tools from the tool crib', t:2.0, canExt:true },
  { id:'prog',   name:'Look up the part program and the drawing', t:1.0, canExt:true },
  { id:'unbolt', name:'Unbolt and remove the old fixture', t:1.5, imp:{ name:'Quick-release clamps', after:0.3, cost:3 } },
  { id:'mount',  name:'Mount and align the new fixture', t:2.5, imp:{ name:'Standard fixture plate with locating pins', after:0.6, cost:4 } },
  { id:'tools',  name:'Change the cutting tools', t:1.5, imp:{ name:'Tools pre-set off-line in a magazine', after:0.4, cost:3 } },
  { id:'trial',  name:'First-piece trial and adjustment', t:1.5, imp:{ name:'Standardised settings, no trial-and-error', after:0.3, cost:2 } },
];
const TPM = { name:'TPM on Machining: availability 95% → 100%', cost:6 };
const BUDGET = 14;   // k€
const MAX1 = 60, MAX2 = 75;

/* ---------------------------------------------------------------- model */
// All times in minutes per day. "fam" = time the stage works for this family.
function metrics(st, D, n, target = 1){
  const fam = T_MIN * st.share;
  const down = fam * (1 - st.a);
  const prod = D * st.units * st.ct / 60;
  const free = fam - down - prod;                 // time left for set-ups
  const setAll = n * st.co;                       // set-up time to make every variant once
  const setNeed = st.co ? (n / target) * st.co : 0;
  const used = prod + down + setNeed;
  const epe = st.co === 0 ? 0 : (free > 0 ? setAll / free : Infinity);
  return { fam, down, prod, free, setAll, setNeed, used, epe,
           overflow: Math.max(0, used - fam), spare: Math.max(0, fam - used) };
}
const f0 = x => Math.round(x).toLocaleString('en-US');
const f1 = x => (Math.round(x * 10) / 10).toLocaleString('en-US', { minimumFractionDigits:1, maximumFractionDigits:1 });
const f2 = x => (Math.round(x * 100) / 100).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
const pct = x => Math.round(x * 100) + '%';
const epeTxt = m => m.epe === 0 ? '1 day (no set-ups)' : (isFinite(m.epe) ? f2(m.epe) + ' days' : 'not capable');
const near = (x, v, tol) => Math.abs(x - v) <= tol;
const parse = s => { const v = parseFloat(String(s).replace(',', '.')); return isNaN(v) ? null : v; };

/* ---------------------------------------------------------------- question 1: current state map */
// Elements of the intern's draft map. "intern" = what the draft shows, "ok" = the correct option.
const MAPQ = [
  { id:'sup', title:'Supplier deliveries', ask:'How often does the raw-material supplier deliver?',
    opts:['Daily', 'Twice a week', 'Weekly', 'Monthly'], lab:[['Daily'], ['2× per week'], ['Weekly'], ['Monthly']], intern:0, ok:2,
    why:'The supplier delivers weekly. That is why 13 days of foils and pipes sit in front of the press and the cutter.' },
  { id:'ship', title:'Deliveries to customers', ask:'How often does Shipping deliver to customers?',
    opts:['Once per day', 'Twice per day', 'Weekly'], lab:[['1× per day'], ['2× per day'], ['Weekly']], intern:0, ok:1,
    why:'Products are delivered to customers twice per day.' },
  { id:'ord', title:'Customer orders → Sales', ask:'What do customers send to Sales?',
    opts:['Daily orders, delivery the next day', 'Daily orders, shipping date 15 days later', 'Weekly orders'],
    lab:[['Daily orders', 'deliver next day'], ['Daily orders', 'ship in 15 days'], ['Weekly orders']], intern:1, ok:0,
    why:'Family B customers order every day and expect delivery the following day. The 15-day lead time belongs to Exercise 1.' },
  { id:'fc', title:'Customer forecast → Production Planning', ask:'What do customers send to Production Planning?',
    opts:['A 30/60/90-day forecast', 'Kanban cards', 'A weekly schedule'], lab:[['Forecast 30/60/90 d'], ['Kanban'], ['Weekly schedule']], intern:0, ok:0,
    why:'Customers send a 30/60/90-day forecast to Production Planning.' },
  { id:'po', title:'Production Planning → Supplier', ask:'What does Production Planning send to the supplier?',
    opts:['30/60-day forecast + weekly order confirmation', 'Daily kanban orders', 'One monthly order'],
    lab:[['Forecast 30/60 d', 'weekly order confirmation'], ['Daily kanban orders', ''], ['Monthly order', '']], intern:0, ok:0,
    why:'PP sends a 30/60-day forecast and confirms orders weekly.' },
  { id:'plan', title:'Production Planning → processes', ask:'How are the five processes scheduled?',
    opts:['A weekly production plan to every process', 'A daily schedule to the last process only', 'Production kanban from the next process'],
    lab:[['Weekly production plan'], ['Daily schedule, last process'], ['Production kanban']], intern:0, ok:0,
    why:'PP tracks the orders and pushes a weekly production plan to each process: a push system.' },
  { id:'disp', title:'Production Planning → Shipping', ask:'What does Shipping receive?',
    opts:['A daily dispatch plan', 'The weekly production plan', 'Nothing'], lab:[['Daily dispatch plan'], ['Weekly plan'], ['–']], intern:0, ok:0,
    why:'Shipping works to a daily dispatch plan from PP.' },
  { id:'flow', title:'Material flow between stages', ask:'Which icon links the stages today?',
    opts:['Push arrows', 'FIFO lanes', 'Supermarkets with kanban'], intern:1, ok:0,
    why:'Each process works to its own weekly plan and pushes parts into the next stock: push arrows. FIFO lanes and supermarkets are future-state tools.' },
  { id:'pshare', title:'Press data box: time for family B', ask:'How much of the press time goes to family B?',
    opts:['100% (dedicated)', '60% of its time', '70% of its time'], lab:[['100% for fam. B'], ['60% for fam. B'], ['70% for fam. B']], intern:0, ok:1,
    why:'The press is shared with other families and works for family B only 60% of its time.' },
  { id:'cct', title:'Cutter data box: cycle time', ask:'What cycle time belongs in the cutter data box?',
    opts:['C/T = 10 s per product', 'C/T = 10 s per pipe, 2 pipes per product', 'C/T = 5 s per pipe'],
    lab:[['C/T = 10 s/product'], ['C/T = 10 s/pipe ×2'], ['C/T = 5 s/pipe']], intern:0, ok:1,
    why:'The cutter takes 10 s per component and each product needs two identical pipes: 20 s of cutter time per product.' },
  { id:'dco', title:'Drilling data box: changeover', ask:'What changeover time does drilling have?',
    opts:['C/O = 100 min', 'C/O = 10 min', 'C/O = 0 min'], lab:[['C/O = 100 min'], ['C/O = 10 min'], ['C/O = 0 min']], intern:0, ok:0,
    why:'Drilling has a 100-minute changeover. It matters again in question 2.' },
];
const MQ = Object.fromEntries(MAPQ.map(e => [e.id, e]));
const MAPERR = MAPQ.filter(e => e.intern !== e.ok).length;
const INV = [   // inventories whose days the player computes
  { k:'press', name:'After the press', qty:20000, unit:'foils', per:1800, ok:20000 / 1800,
    slips:[[20000 / 300, 'Divide by the total daily demand (1,800), not by the demand of one variant.']] },
  { k:'cutter', name:'After the cutter', qty:21600, unit:'pipes', per:3600, ok:6,
    slips:[[12, 'Each product needs two pipes, so the plant uses 3,600 pipes a day, not 1,800.'], [72, 'Divide by the pipes used per day by the whole family (3,600).']] },
  { k:'weld', name:'After welding', qty:4000, unit:'pcs', per:1800, ok:4000 / 1800, slips:[[4000 / 300, 'Divide by 1,800 pcs/day, the demand of the whole family.']] },
  { k:'drill', name:'After drilling', qty:5000, unit:'pcs', per:1800, ok:5000 / 1800, slips:[[5000 / 300, 'Divide by 1,800 pcs/day, the demand of the whole family.']] },
  { k:'fg', name:'Finished goods', qty:30000, unit:'pcs', per:1800, ok:30000 / 1800, slips:[[100, 'Divide by 1,800 pcs/day, the demand of the whole family.']] },
];
const LT_OK = 13 + 20000 / 1800 + 4000 / 1800 + 5000 / 1800 + 30000 / 1800;   // 45.78 d along the press branch
const VA_OPTS = [
  ['65 s', true, 'Max(press 4 s, cutter 2 × 10 s) + welding 10 + drilling 12 + finishing 23 = 65 s. Parallel stages count once, with the longer time per product.'],
  ['69 s', false, 'That adds both parallel branches. Press and cutter work at the same time, so only the longer of the two counts.'],
  ['49 s', false, 'That follows the press only. The cutter spends 2 × 10 s on every product, longer than the press.'],
  ['55 s', false, 'Close, but the cutter needs two pipes per product: 2 × 10 s = 20 s, not 10 s.'],
];
const MAXQ1 = 10 + 6 * INV.length + 10 + 5 + 5 * MAPERR;

function q1Fresh(){ return { step:1, pts:{}, tries:{}, msg:{}, ok:{}, va:[], sel:null, submitted:false,
  ch:Object.fromEntries(MAPQ.map(e => [e.id, e.intern])) }; }

/* --- SVG drawing helpers (map coordinates: 1000 × 610) */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const tx = (x, y, s, cls = 'mt', anchor = 'middle') => `<text x="${x}" y="${y}" class="${cls}" text-anchor="${anchor}">${esc(s)}</text>`;
const tl = (x, y, lines, cls = 'mt', anchor = 'middle', dy = 11) => `<text x="${x}" y="${y}" class="${cls}" text-anchor="${anchor}">${lines.filter(l => l !== '').map((l, i) => `<tspan x="${x}" dy="${i ? dy : 0}">${esc(l)}</tspan>`).join('')}</text>`;
function zig(pts){   // polyline with an "electronic" lightning in the longest segment
  let best = 0, bl = 0;
  for (let i = 0; i < pts.length - 1; i++){ const l = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]); if (l > bl){ bl = l; best = i; } }
  const [a, b] = [pts[best], pts[best + 1]], ux = (b[0] - a[0]) / bl, uy = (b[1] - a[1]) / bl, nx = -uy, ny = ux, mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
  const k = [[mx - 8 * ux, my - 8 * uy], [mx + 2 * ux + 7 * nx, my + 2 * uy + 7 * ny], [mx - 2 * ux - 7 * nx, my - 2 * uy - 7 * ny], [mx + 8 * ux, my + 8 * uy]];
  return [...pts.slice(0, best + 1), ...k, ...pts.slice(best + 1)];
}
const pl = (pts, cls = 'ml', head = true) => `<polyline points="${pts.map(p => p.join(',')).join(' ')}" class="${cls}" ${head ? 'marker-end="url(#ah)"' : ''}/>`;
function factory(x, y, label){
  return `<path class="mbox" d="M${x},${y + 70} V${y + 22} L${x + 22},${y} V${y + 22} L${x + 44},${y} V${y + 22} L${x + 66},${y} V${y + 22} L${x + 88},${y} V${y + 70} Z"/>${tx(x + 44, y + 55, label, 'mt b')}`;
}
function truck(x, y){
  return `<rect class="mbox" x="${x}" y="${y}" width="50" height="30"/><rect class="mbox" x="${x + 50}" y="${y + 10}" width="18" height="20"/><circle class="mfill" cx="${x + 12}" cy="${y + 33}" r="5"/><circle class="mfill" cx="${x + 56}" cy="${y + 33}" r="5"/>`;
}
function tri(cx, cy, lines){
  return `<path class="mbox" d="M${cx},${cy - 18} L${cx + 18},${cy + 16} L${cx - 18},${cy + 16} Z"/>${tx(cx, cy + 12, 'I', 'mt b')}${tl(cx, cy + 30, lines, 'mt s')}`;
}
function procBox(x, y, name, lines){
  return `<rect class="mbox" x="${x}" y="${y}" width="92" height="40"/>${tx(x + 46, y + 24, name, 'mt b')}
    <rect class="mbox" x="${x}" y="${y + 40}" width="92" height="58"/>${lines.map((l, i) => (i ? `<line class="mthin" x1="${x}" x2="${x + 92}" y1="${y + 40 + i * 14.5}" y2="${y + 40 + i * 14.5}"/>` : '') + tx(x + 4, y + 51 + i * 14.5, l, 'mt s', 'start')).join('')}`;
}
function flowArrow(style, x1, y1, x2, y2){   // drawn horizontally, rotated into place
  const L = Math.hypot(x2 - x1, y2 - y1), ang = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
  let g;
  if (style === 0) g = `<path class="mbox" d="M0,-4 H${L - 9} V-7 L${L},0 L${L - 9},7 V4 H0 Z"/>${L > 20 ? `<rect class="mfill" x="2" y="-4" width="2.5" height="8"/><rect class="mfill" x="7" y="-4" width="2.5" height="8"/>` : ''}`;
  else if (style === 1) g = `<line class="ml" x1="0" x2="${L}" y1="-6" y2="-6"/><line class="ml" x1="0" x2="${L}" y1="6" y2="6"/>${tx(L / 2 - 2, 3, 'FIFO', 'mt xs')}<line class="ml" x1="${L - 10}" x2="${L}" y1="0" y2="0" marker-end="url(#ah)"/>`;
  else g = `<path class="ml" d="M${L - 4},-10 H4 V10 H${L - 4} M4,-3 H${L - 4} M4,4 H${L - 4}" fill="none"/>`;
  return `<g transform="translate(${x1},${y1}) rotate(${ang})">${g}</g>`;
}
function shipArrow(pts){
  const [a, b] = pts.slice(-2), ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
  const hx = b[0], hy = b[1], s = 9, p = (t, o) => [hx - Math.cos(ang) * t - Math.sin(ang) * o, hy - Math.sin(ang) * t + Math.cos(ang) * o];
  const short = [...pts.slice(0, -1), p(s, 0)];
  return `${pl(short, 'mship', false)}${pl(short, 'mship2', false)}<polygon class="mbox" points="${[p(s, -9), [hx, hy], p(s, 9)].map(q => q.join(',')).join(' ')}"/>`;
}

  ${hot('plan', 185, 135, 190, 26, pl([[430, 90], [205, 248]]) + pl([[455, 90], [390, 248]]) + pl([[505, 90], [574, 248]]) + pl([[525, 90], [758, 248]]) + pl([[412, 90], [142, 232], [142, 418], [158, 418]]) + tx(280, 152, L('plan')[0], 'mt s i halo'))}
  ${hot('disp', 700, 150, 130, 26, pl([[555, 90], [925, 248]]) + tx(765, 167, L('disp')[0], 'mt s i halo'))}
  ${hot('sup', 24, 126, 84, 76, truck(30, 135) + tx(64, 194, L('sup')[0], 'mt s b'))}

function renderQ1(){
  const m = S.q1;
  const labels = ['Takt time', 'Inventory days', 'Timeline', 'Check the map', 'Your map'];
  let body = '';
  const mapPanel = (o = {}) => `<div class="panel mapwrap">${mapSVG({ ch:m.ch, q1:m, ...o })}</div>`;

  if (m.step === 1){
    body = `<div class="stack">
      <p>Your intern started the <b>current state map of family B</b>. The icons are there, but the numbers are missing and some details are wrong. Finish it question by question.</p>
      ${mapPanel()}
      <div class="grid2"><section class="stack"><h2>Start with the customer: takt time</h2>
        <div class="params"><div><small>Demand D</small><b>1,800</b><small>pcs/day</small></div><div><small>Shifts</small><b>2 × 8 h</b><small>30 min break each</small></div><div><small>Variants</small><b>6</b><small>sold every day</small></div></div>
      </section><section class="panel stack">
        <h3>Takt time (seconds per piece)</h3>
        <div class="ask"><input id="tt" inputmode="decimal" placeholder="s/pc" class="${m.ok.tt ? 'ok' : ''}" ${m.ok.tt ? 'disabled value="30"' : ''}><button class="btn small" id="ctt" ${m.ok.tt ? 'disabled' : ''}>Check</button></div>
        ${m.msg.tt ? `<div class="msg ${m.ok.tt ? 'ok' : 'no'}">${m.msg.tt}</div>` : ''}
        ${m.ok.tt ? '<div class="btns"><button class="btn primary" id="next">Inventory days →</button></div>' : ''}
      </section></div></div>`;
  }

  if (m.step === 2){
    const all = INV.every(i => m.ok[i.k]);
    body = `<div class="stack">${mapPanel()}
      <div class="grid2"><section class="stack"><h2>Days of inventory</h2>
        <p>Each triangle shows a quantity. On the map, write it as <b>days of demand</b>: stock ÷ what the plant uses in a day. Raw material is already given as 13 days.</p>
        <div class="formula">days = quantity ÷ daily consumption<br>pieces: 1,800 per day · pipes: 2 × 1,800 = 3,600 per day</div>
      </section><section class="panel stack">
        ${INV.map(i => `<div class="stack" style="gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)">
          <h3>${i.name} <span class="muted num" style="font-weight:400;font-size:.85rem">${f0(i.qty)} ${i.unit}</span></h3>
          <div class="ask"><input data-inv="${i.k}" inputmode="decimal" placeholder="days" class="${m.ok[i.k] ? 'ok' : ''}" ${m.ok[i.k] ? `disabled value="${f2(i.ok)}"` : ''}><button class="btn small" data-cinv="${i.k}" ${m.ok[i.k] ? 'disabled' : ''}>Check</button></div>
          ${m.msg[i.k] ? `<div class="msg ${m.ok[i.k] ? 'ok' : 'no'}">${m.msg[i.k]}</div>` : ''}</div>`).join('')}
        ${all ? '<div class="btns"><button class="btn primary" id="next">Timeline →</button></div>' : ''}
      </section></div></div>`;
  }

  if (m.step === 3){
    const vaDone = !!m.ok.va;
    body = `<div class="stack">${mapPanel()}
      <div class="grid2"><section class="stack"><h2>The timeline</h2>
        <p>The top of the staircase adds the waiting time in stock. The bottom adds the processing time of one piece. Press and cutter work <b>in parallel</b>, so only one branch counts.</p>
        <div class="tbl"><table><thead><tr><th>Branch</th><th>RM</th><th>Stock after</th><th>Total</th></tr></thead><tbody>
          <tr><td>Press (foils)</td><td>13 d</td><td>11.11 d</td><td>24.11 d</td></tr><tr><td>Cutter (pipes)</td><td>13 d</td><td>6.00 d</td><td>19.00 d</td></tr></tbody></table></div>
        <p class="muted" style="font-size:.85rem">After the welding everything is in one line: 2.22 + 2.78 + 16.67 days.</p>
      </section><section class="panel stack">
        <h3>a) Production lead time (days)</h3>
        <div class="ask"><input id="lt" inputmode="decimal" placeholder="days" class="${m.ok.lt ? 'ok' : ''}" ${m.ok.lt ? `disabled value="${f2(LT_OK)}"` : ''}><button class="btn small" id="clt" ${m.ok.lt ? 'disabled' : ''}>Check</button></div>
        ${m.msg.lt ? `<div class="msg ${m.ok.lt ? 'ok' : 'no'}">${m.msg.lt}</div>` : ''}
        <h3>b) Value-added time per piece</h3>
        <div class="mc">${VA_OPTS.map((v, i) => `<button data-va="${i}" class="${m.va.includes(i) ? (v[1] ? 'ok' : 'no') : ''}" ${vaDone ? 'disabled' : ''}>${v[0]}</button>`).join('')}</div>
        ${m.msg.va ? `<div class="msg ${vaDone ? 'ok' : 'no'}">${m.msg.va}</div>` : ''}
        ${m.ok.lt && vaDone ? '<div class="btns"><button class="btn primary" id="next">Check the intern\'s map →</button></div>' : ''}
      </section></div></div>`;
  }

  if (m.step === 4){
    const sel = m.sel ? MQ[m.sel] : null;
    const changed = MAPQ.filter(e => m.ch[e.id] !== e.intern).length;
    body = `<div class="stack">
      <div class="msg info">The intern made <b>${MAPERR} mistakes</b> in the icons, flows and data boxes. Click any label, arrow or data-box line on the map, or pick an item from the list, and set what it should show. Changing a correct item costs points.</div>
      ${mapPanel({ click:true, sel:m.sel })}
      <div class="grid2"><section class="panel stack">
        <h3>Map items</h3>
        <div class="chips">${MAPQ.map(e => `<button class="chip ${m.sel === e.id ? 'on' : ''} ${m.ch[e.id] !== e.intern ? 'ed' : ''}" data-sel="${e.id}">${e.title}<small>${e.opts[m.ch[e.id]]}</small></button>`).join('')}</div>
      </section><section class="panel stack">
        ${sel ? `<span class="eyebrow">${sel.title}</span><h3>${sel.ask}</h3>
          <div class="mc">${sel.opts.map((t, i) => `<button data-opt="${i}" class="${m.ch[sel.id] === i ? 'on' : ''}">${m.ch[sel.id] === i ? '● ' : '○ '}${t}${i === sel.intern ? ' <span class="muted">(intern\'s draft)</span>' : ''}</button>`).join('')}</div>`
          : '<p class="muted">Select an item on the map or in the list.</p>'}
        <p class="muted num" style="font-size:.82rem">${changed} item${changed === 1 ? '' : 's'} changed so far</p>
        <div class="btns"><button class="btn primary" id="submit">Hand in the map</button></div>
      </section></div></div>`;
  }

  if (m.step === 5){
    const marks = Object.fromEntries(MAPQ.map(e => [e.id, m.ch[e.id] === e.ok]));
    const shown = Object.fromEntries(MAPQ.filter(e => e.intern !== e.ok || m.ch[e.id] !== e.ok).map(e => [e.id, marks[e.id]]));
    const fixed = MAPQ.filter(e => e.intern !== e.ok && m.ch[e.id] === e.ok).length;
    const broke = MAPQ.filter(e => e.intern === e.ok && m.ch[e.id] !== e.ok).length;
    const pts = sum(m.pts);
    body = `<div class="stack">
      <div class="grid2"><section class="stack"><h2>Your map · ${fixed} of ${MAPERR} mistakes fixed${broke ? `, ${broke} correct item${broke > 1 ? 's' : ''} changed` : ''}</h2>
        <p class="muted">Outlined: the intern's mistakes (green = fixed, red = still wrong) and any correct item you changed (red).</p></section>
        <section class="stack" style="align-items:flex-end"><span class="score">Question 1: ${pts} / ${MAXQ1}</span></section></div>
      ${mapPanel({ marks:shown })}
      <div class="grid2"><section class="panel stack"><h3>Item by item</h3>
        <div class="tbl"><table><thead><tr><th>Item</th><th style="text-align:left">Correct</th><th></th></tr></thead><tbody>
        ${MAPQ.map(e => `<tr><td>${e.title}</td><td style="text-align:left">${e.opts[e.ok]}</td><td class="${marks[e.id] ? 'ok' : 'hl'}">${marks[e.id] ? '✓' : '✗'}</td></tr>`).join('')}</tbody></table></div>
        <div class="btns"><button class="btn small" id="showok">${m.showOk ? 'Show my map' : 'Show the corrected map'}</button></div>
      </section><section class="panel stack debrief"><h3>What the current state map tells you</h3>
        ${MAPQ.filter(e => !marks[e.id] || e.intern !== e.ok).map(e => `<p><b>${e.title}.</b> ${e.why}</p>`).join('')}
        <div class="formula">Takt time = 54,000 s ÷ 1,800 = 30 s<br>Lead time (press branch) = 13 + 11.11 + 2.22 + 2.78 + 16.67 = 45.78 days<br>Value-added time = 20 + 10 + 12 + 23 = 65 s → VA is ≈ 0.003% of the lead time</div>
        <p>A push system with weekly plans everywhere, and stocks of several days between every pair of stages. Question 2 asks how flexible each stage really is.</p>
        <div class="btns"><button class="btn primary" data-go="m2">Question 2 →</button><button class="btn" data-go="home">Back to missions</button></div>
      </section></div></div>`;
    if (m.showOk) body = body.replace(mapPanel({ marks:shown }), mapPanel({ ch:Object.fromEntries(MAPQ.map(e => [e.id, e.ok])) }));
  }

  app.innerHTML = header('Question 1 · Current state map, family B') + `<div class="stack">
    <div class="btns" style="justify-content:space-between"><button class="btn small" id="home">← Missions</button>${steps(labels, m.step)}</div>${body}</div>`;
  wireQ1();
}

function wireQ1(){
  const m = S.q1, $ = id => document.getElementById(id);
  $('home').onclick = () => { S.screen = 'home'; render(); };
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { S.screen = b.dataset.go; render(); });
  const next = $('next'); if (next) next.onclick = () => { m.step++; render(); };
  const enter = (el, fn) => { if (el && !el.disabled) el.onkeydown = e => { if (e.key === 'Enter') fn(); }; };
  if (m.step === 1){
    const chk = () => { const v = parse($('tt').value); if (v === null) return; m.tries.tt = (m.tries.tt || 0) + 1;
      if (near(v, 30, 0.05)){ m.ok.tt = true; m.pts.tt = m.tries.tt === 1 ? 10 : 5; m.msg.tt = '<b class="ok">Correct: 30 s.</b> 2 × (480 − 30) min × 60 = 54,000 s a day ÷ 1,800 pcs. The customer takes one piece every 30 seconds.'; }
      else if (near(v, 32, 0.05)) m.msg.tt = '<b class="no">Close.</b> You used 16 hours. Take the two 30-minute breaks out first.';
      else if (near(v, 15, 0.05) || near(v, 16, 0.05)) m.msg.tt = '<b class="no">That is one shift.</b> The plant works two shifts a day.';
      else if (near(v, 0.5, 0.01)) m.msg.tt = '<b class="no">That is in minutes.</b> Give the answer in seconds.';
      else m.msg.tt = '<b class="no">Not yet.</b> Takt time = available time per day ÷ daily demand.';
      render(); };
    if ($('ctt')) $('ctt').onclick = chk; enter($('tt'), chk); if ($('tt') && !$('tt').disabled) $('tt').focus({ preventScroll:true });
  }
  if (m.step === 2){
    const chk = k => { const i = INV.find(x => x.k === k), v = parse(app.querySelector(`[data-inv="${k}"]`).value); if (v === null) return;
      m.tries[k] = (m.tries[k] || 0) + 1;
      if (near(v, i.ok, 0.05)){ m.ok[k] = true; m.pts[k] = m.tries[k] === 1 ? 6 : 3; m.msg[k] = `<b class="ok">Correct:</b> ${f0(i.qty)} ÷ ${f0(i.per)} = ${f2(i.ok)} days.`; }
      else { const s = i.slips.find(x => near(v, x[0], 0.05)); m.msg[k] = `<b class="no">Not yet.</b> ${s ? s[1] : `Divide ${f0(i.qty)} ${i.unit} by the ${i.unit} used per day.`}`; }
      render(); const n = app.querySelector('[data-inv]:not([disabled])'); if (n) n.focus({ preventScroll:true }); };
    app.querySelectorAll('[data-cinv]').forEach(b => b.onclick = () => chk(b.dataset.cinv));
    app.querySelectorAll('[data-inv]').forEach(inp => enter(inp, () => chk(inp.dataset.inv)));
    const first = app.querySelector('[data-inv]:not([disabled])'); if (first) first.focus({ preventScroll:true });
  }
  if (m.step === 3){
    const chk = () => { const v = parse($('lt').value); if (v === null) return; m.tries.lt = (m.tries.lt || 0) + 1;
      if (near(v, LT_OK, 0.06) || v === 46){ m.ok.lt = true; m.pts.lt = m.tries.lt === 1 ? 10 : 5; m.msg.lt = `<b class="ok">Correct: ${f2(LT_OK)} days</b> along the press branch (24.11 d beats the cutter's 19.00 d), then 2.22 + 2.78 + 16.67.`; }
      else if (near(v, 64.78, 0.1)) m.msg.lt = '<b class="no">You added both branches.</b> Foils and pipes wait at the same time, so only the longer branch counts.';
      else if (near(v, 40.67, 0.1)) m.msg.lt = '<b class="no">That is the cutter branch.</b> Take the longer of the two branches.';
      else if (near(v, 32.78, 0.1)) m.msg.lt = '<b class="no">Raw material is missing.</b> The 13 days in front of the press are part of the lead time.';
      else m.msg.lt = '<b class="no">Not yet.</b> Longest branch (RM + stock after it) + the three stocks after welding.';
      render(); };
    if ($('clt')) $('clt').onclick = chk; enter($('lt'), chk); if ($('lt') && !$('lt').disabled) $('lt').focus({ preventScroll:true });
    app.querySelectorAll('[data-va]').forEach(b => b.onclick = () => { const i = +b.dataset.va; if (m.va.includes(i)) return; m.va.push(i);
      if (VA_OPTS[i][1]){ m.ok.va = true; m.pts.va = m.va.length === 1 ? 5 : m.va.length === 2 ? 2 : 0; m.msg.va = `<b class="ok">Correct.</b> ${VA_OPTS[i][2]}`; }
      else m.msg.va = `<b class="no">${VA_OPTS[i][0]}:</b> ${VA_OPTS[i][2]}`; render(); });
  }
  if (m.step === 4){
    const pick = id => { m.sel = id; render(); };
    app.querySelectorAll('.hot.clk').forEach(g => { g.onclick = () => pick(g.dataset.e); g.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); pick(g.dataset.e); } }; });
    app.querySelectorAll('[data-sel]').forEach(b => b.onclick = () => pick(b.dataset.sel));
    app.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => { m.ch[m.sel] = +b.dataset.opt; render(); });
    $('submit').onclick = () => {
      let p = 0; MAPQ.forEach(e => { if (e.intern !== e.ok && m.ch[e.id] === e.ok) p += 5; if (e.intern === e.ok && m.ch[e.id] !== e.ok) p -= 3; });
      m.pts.map = Math.max(0, p); m.submitted = true; m.step = 5; saveBest('q1', sum(m.pts)); render(); window.scrollTo(0, 0); };
  }
  if (m.step === 5){ const b = $('showok'); if (b) b.onclick = () => { m.showOk = !m.showOk; render(); }; }
}

// rows: [{st, m, hide, note}]
function barsHTML(rows){
  const scale = Math.min(2 * T_MIN, Math.max(T_MIN, ...rows.map(r => r.hide ? T_MIN : Math.max(T_MIN, r.m.fam + r.m.overflow))));
  const w = v => (100 * Math.max(0, v) / scale).toFixed(3) + '%';
  return `<div class="bars">${rows.map((r, idx) => {
    const m = r.m, segs = [];
    const prod = Math.min(m.prod, m.fam), down = Math.min(m.down, m.fam - prod);
    segs.push(['prod', prod], ['down', down]);
    let over = 0;
    if (r.hide) { segs.push(['free', Math.max(0, m.free)]); }
    else {
      const room = Math.max(0, m.fam - prod - down);
      segs.push(['setup', Math.min(m.setNeed, room)], ['free', m.spare]);
      over = m.overflow; if (over > 0) segs.push(['over', Math.min(over, scale - m.fam)]);
    }
    const other = Math.max(0, T_MIN - m.fam - over);
    if (other > 0) segs.push(['other', other]);
    const marks = `<span class="mk" style="left:${w(T_MIN)}">${idx === 0 ? `<span>day ends · ${T_MIN} min</span>` : ''}</span>` +
      (r.st.share < 1 ? `<span class="mk fam" style="left:${w(m.fam)}" title="${pct(r.st.share)} of the day for this family"></span>` : '');
    return `<div class="barrow"><div class="nm">${r.st.name}<small>C/O ${r.st.co} min · A ${pct(r.st.a)}</small></div>
      <div class="bar" role="img" aria-label="${r.st.name}: production ${f0(m.prod)} min, breakdowns ${f0(m.down)} min, set-ups ${f0(m.setNeed)} min">
      ${segs.filter(s => s[1] > 0.01).map(s => `<i class="${s[0]}" style="width:${w(s[1])}">${s[0] === 'other' && 100 * s[1] / scale > 13 ? '<em>other families</em>' : ''}</i>`).join('')}${marks}</div>
      ${r.note ? `<div class="barnote">${r.note}</div>` : ''}</div>`;
  }).join('')}</div>`;
}
function stageTable(c, extra){
  const shared = c.stages.some(s => s.share < 1);
  return `<div class="tbl"><table><thead><tr><th>Stage</th><th>C/T (s)</th><th>C/O (min)</th><th>A</th>${shared ? '<th>Share for family</th><th>Units / product</th>' : ''}${extra ? '<th>' + extra.h + '</th>' : ''}</tr></thead><tbody>
  ${c.stages.map((s, i) => `<tr><td>${s.name}</td><td>${s.ct}${s.unit ? ' / ' + s.unit : ''}</td><td>${s.co}</td><td>${pct(s.a)}</td>${shared ? `<td>${pct(s.share)}</td><td>${s.units}</td>` : ''}${extra ? extra.f(s, i) : ''}</tr>`).join('')}
  </tbody></table></div>`;
}

/* ---------------------------------------------------------------- mission 1 */
function smedState(){
  const m = S.m1;
  let internal = 0, external = 0, cost = m.tpm ? TPM.cost : 0;
  SMED.forEach(e => {
    const t = m.imp[e.id] ? e.imp.after : e.t;
    if (m.imp[e.id]) cost += e.imp.cost;
    if (m.ext[e.id]) external += t; else internal += t;
  });
  const st = { ...CASE_A.stages[0], co:internal, a: m.tpm ? 1 : .95 };
  const mm = metrics(st, CASE_A.D, CASE_A.n, 1);
  return { internal, external, cost, st, mm, maxCO: mm.free / CASE_A.n, ok: mm.epe <= 1 + 1e-9 };
}

    EPE = 680 ÷ 142.5 = <b>4.77 ≈ 5 days</b> (Heat treatment, Assembly: no C/O → 1 day)<br>
    EPE = 1 day → 68 set-ups/day → C/O ≤ 142.5 ÷ 68 = <b>2.10 min</b> (−79%) → <b>SMED on Machining</b></div>
    <p><b>Course answer:</b> only Machining blocks the target, and the fix is SMED on Machining, cutting each set-up to ≤ 2.1 min. Your workshop reached <b class="num">${f2(s.internal)} min</b> for <b class="num">${s.cost} k€</b>${s.cost === 12 && !S.m1.tpm ? ', the cheapest way to get there' : ''}.</p>
    <p>Why TPM alone is not enough: at 100% availability the limit only rises to ${f2((900 - 712.5) / 68)} min, still far below 10 min. Separating internal from external work is free and gets you from 10 to 7 min before you spend anything.</p>
    <p>Why it matters: a shorter EPE means smaller batches (≈ ${f1(450 / 68)} pcs per variant instead of ≈ ${f0(450 / 68 * s.epe0)}) and about ${f0(450 * s.epe0 / 2 - 450 / 2)} fewer pieces of cycle stock on the floor.</p>
    <div class="btns"><button class="btn primary" data-go="lab">Open the lab</button><button class="btn" data-go="home">Back to missions</button></div></section>`;
}

function wireM1(){
  const m = S.m1, c = CASE_A, $ = id => document.getElementById(id);
  $('home').onclick = () => { S.screen = 'home'; render(); };
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { S.screen = b.dataset.go; render(); });
  const next = $('next'); if (next) next.onclick = () => { m.step++; render(); };
  if (m.step === 1) app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
    const i = +b.dataset.p; if (m.picked.includes(i)) return;
    m.picked.push(i); m.tries.spot = (m.tries.spot || 0) + 1;
    if (i === 0){ m.pts.spot = m.tries.spot === 1 ? 10 : m.tries.spot === 2 ? 4 : 0;
      m.msg.spot = `<b class="ok">Right.</b> Machining needs 68 × 10 = 680 min of set-ups a day but has only 142.5 min left after production and breakdowns. Heat treatment and Assembly change variant with no set-up.`; }
    else m.msg.spot = `<b class="no">Not this one.</b> ${c.stages[i].name} has C/O = 0: switching variant costs no time, so it can make all 68 every day. Which stage loses time at every change?`;
    render();
  });
  if (m.step === 2){
    const mach = metrics(c.stages[0], c.D, c.n);
    if ($('hint')) $('hint').onclick = () => { m.hint = true; m.pts.hint = -4; render(); };
    const chkFree = () => { const v = parse($('free').value); if (v === null) return;
      m.tries.free = (m.tries.free || 0) + 1;
      if (near(v, mach.free, 1)){ m.msg.freeOk = true; m.pts.free = m.tries.free === 1 ? 10 : 5; m.msg.free = `<b class="ok">Correct:</b> 900 × 0.95 − 450 × 95 ÷ 60 = 855 − 712.5 = 142.5 min/day.`; }
      else if (near(v, 187.5, 1)) m.msg.free = `<b class="no">Close.</b> You used the full 900 min. Machining is down 5% of the time (A = 95%).`;
      else if (near(v, 855, 1)) m.msg.free = `<b class="no">That is the time the machine is available.</b> Production of 450 pcs still has to come out of it.`;
      else m.msg.free = `<b class="no">Not yet.</b> Start from 900 min, remove breakdowns (1 − A), then remove production time (D × C/T).`;
      render(); };
    const chkEpe = () => { const v = parse($('epe').value); if (v === null) return;
      m.tries.epe = (m.tries.epe || 0) + 1;
      if (near(v, mach.epe, 0.08) || v === 5){ m.msg.epeOk = true; m.pts.epe = m.tries.epe === 1 ? 10 : 5;
        m.msg.epe = `<b class="ok">${v === 5 ? 'Yes, 5 whole days' : 'Correct'}:</b> 68 × 10 ÷ 142.5 = 4.77 days. Machining can cycle through all 68 variants only about once every 5 days.`; }
      else if (near(v, 1 / mach.epe, 0.03)) m.msg.epe = `<b class="no">Upside down.</b> EPE = set-up time needed ÷ set-up time available per day.`;
      else if (near(v, 680 / 187.5, 0.05)) m.msg.epe = `<b class="no">Check the time left:</b> use 142.5 min, not 187.5.`;
      else m.msg.epe = `<b class="no">Not yet.</b> How many minutes do 68 set-ups take, and how many days of 142.5 free minutes is that?`;
      render(); };
    if ($('cfree')) $('cfree').onclick = chkFree;
    if ($('cepe')) $('cepe').onclick = chkEpe;
    ['free', 'epe'].forEach(id => { const el = $(id); if (el && !el.disabled) el.onkeydown = e => { if (e.key === 'Enter') (id === 'free' ? chkFree : chkEpe)(); }; });
    const focus = !m.msg.freeOk ? $('free') : (!m.msg.epeOk ? $('epe') : null); if (focus) focus.focus({ preventScroll:true });
  }
  if (m.step === 3){
    app.querySelectorAll('[data-ext]').forEach(b => b.onclick = () => {
      const e = SMED.find(x => x.id === b.dataset.ext);
      if (m.ext[e.id]) { delete m.ext[e.id]; m.smedMsg = ''; }
      else if (e.canExt) { m.ext[e.id] = true; m.smedMsg = `✓ Moved to external: "${e.name.toLowerCase()}" now happens while the previous variant is still running. It costs nothing.`; }
      else { m.mistakes++; m.smedMsg = `The machine has to be stopped for this ("${e.name.toLowerCase()}"), so it stays internal. Shorten it instead (−2 points).`; }
      render(); });
    app.querySelectorAll('[data-imp]').forEach(b => b.onclick = () => { const id = b.dataset.imp; if (m.imp[id]) delete m.imp[id]; else m.imp[id] = true; m.smedMsg = ''; render(); });
    app.querySelectorAll('[data-tpm]').forEach(b => b.onclick = () => { m.tpm = !m.tpm;
      m.smedMsg = m.tpm ? `TPM raises availability to 100%, so the time left grows to 187.5 min and the C/O limit to 2.76 min. It helps, but it uses ${TPM.cost} k€ of your budget.` : ''; render(); });
    const n = $('next'); if (n) n.onclick = () => { m.pts.smed = Math.max(10, 30 - 2 * m.mistakes); m.step = 4; render(); };
  }
  if (m.step === 4){
    const s = smedState(), mach = metrics(c.stages[0], c.D, c.n);
    const perB = Math.floor(mach.free / 10), perA = Math.min(68, Math.floor(s.mm.free / s.internal));
    const draw = (id, per, upto) => { let h = '';
      for (let d = 0; d < 5; d++){ h += `<span>${['Mon', 'Tue', 'Wed', 'Thu', 'Fri'][d]}</span><div class="cells">`;
        for (let v = 0; v < 68; v++){ const start = (d * per) % 68; const on = d < upto && (per >= 68 || ((v - start + 68) % 68) < per); h += `<i class="${on ? 'on' : ''}"></i>`; }
        h += '</div>'; }
      $(id).innerHTML = h; };
    draw('wb', perB, m.ran ? 5 : 0); draw('wa', perA, m.ran ? 5 : 0);
    $('run').onclick = () => {
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let d = 0; const tick = () => { d++; draw('wb', perB, d); draw('wa', perA, d);
        if (d < 5 && !reduce) setTimeout(tick, 380); else { if (!m.ran){ m.ran = true; saveBest('m1', sum(m.pts)); } render(); } };
      if (reduce) { d = 4; } tick(); };
  }
}

function wireM2(M){
  const m = S.m2, c = CASE_B, $ = id => document.getElementById(id);
  $('home').onclick = () => { S.screen = 'home'; render(); };
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { S.screen = b.dataset.go; if (b.dataset.go === 'lab') S.lab = { key:'B', target:1, st:null }; render(); });
  const next = $('next'); if (next) next.onclick = () => { m.step++; if (m.step === 4) saveBest('m2', sum(m.pts)); render(); };
  if (m.step === 1){
    app.querySelectorAll('[data-hint]').forEach(b => b.onclick = () => { const k = b.dataset.hint; m.hints[k] = (m.hints[k] || 0) + 1; render(); });
    const check = (k, i) => {
      const v = parse(app.querySelector(`[data-in="${k}"]`).value); if (v === null) return;
      m.tries[k] = (m.tries[k] || 0) + 1;
      const right = M[i].epe;
      if (near(v, right, 0.05)){
        m.solved[k] = true;
        const base = m.tries[k] === 1 ? 15 : m.tries[k] === 2 ? 10 : 6;
        m.pts[k] = Math.max(3, base - 3 * (m.hints[k] || 0));
        m.msg[k] = `<b class="ok">Correct: ${f2(right)} days.</b> ${f0(M[i].setAll)} min of set-ups ÷ ${f1(M[i].free)} min left per day.`;
      } else {
        const w = (M2WRONG[k] || []).find(x => near(v, x[0], 0.012));
        m.msg[k] = `<b class="no">Not yet.</b> ${w ? w[1] : 'Time left = T × share × A − D × units × C/T, then EPE = n × C/O ÷ time left.'}`;
      }
      render();
      const nextIn = app.querySelector('[data-in]:not([disabled])'); if (nextIn) nextIn.focus({ preventScroll:true });
    };
    app.querySelectorAll('[data-chk]').forEach(b => b.onclick = () => check(b.dataset.chk, +b.dataset.i));
    app.querySelectorAll('[data-in]').forEach(inp => inp.onkeydown = e => { if (e.key === 'Enter'){ const k = inp.dataset.in; check(k, +Object.keys(M2Q).find(x => M2Q[x] === k)); } });
  }
  if (m.step === 2){
    const chk = () => { const v = parse($('ce').value); if (v === null) return; m.tries.ce = (m.tries.ce || 0) + 1;
      if (v === 3 || near(v, 3, 0.01)){ m.epeOk = true; m.pts.ce = m.tries.ce === 1 ? 10 : 5; m.msg.ce = `<b class="ok">Correct: 3 days.</b> The plant can only promise what its least flexible stage can do.`; }
      else if (near(v, 2.31, 0.1) || v === 2) m.msg.ce = `<b class="no">That is the press.</b> Another stage needs even longer to cycle through all six variants.`;
      else if (v < 2) m.msg.ce = `<b class="no">Too optimistic.</b> Can every stage really make all six variants that often?`;
      else m.msg.ce = `<b class="no">Not quite.</b> Take the largest stage EPE and round it up to whole days.`;
      render(); };
    if ($('cce')) $('cce').onclick = chk;
    if ($('ce') && !$('ce').disabled){ $('ce').onkeydown = e => { if (e.key === 'Enter') chk(); }; $('ce').focus({ preventScroll:true }); }
    app.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { const i = +b.dataset.st; if (m.picked.includes(i)) return; m.picked.push(i); m.tries.st = (m.tries.st || 0) + 1;
      if (i === 1){ m.stageOk = true; m.pts.st = m.tries.st === 1 ? 10 : m.tries.st === 2 ? 5 : 0; m.msg.st = `<b class="ok">The cutter.</b> 3.00 days, ahead of the press at 2.31 days.`; }
      else if (i === 0) m.msg.st = `<b class="no">Close.</b> The press has the longest set-up, but it still cycles in 2.31 days. One stage needs longer.`;
      else m.msg.st = `<b class="no">No.</b> ${c.stages[i].name} cycles in ${c.stages[i].co ? f2(M[i].epe) : '1'} day(s).`;
      render(); });
  }
  if (m.step === 3) app.querySelectorAll('[data-mc]').forEach(b => b.onclick = () => { const i = +b.dataset.mc; if (m.mc.includes(i)) return; m.mc.push(i);
    const why = ['No: 15 min against 120 min at the press and 100 min at drilling.', '', 'No: the cutter has A = 100%, the best in the plant.', 'No: every stage makes the same 6 variants.'];
    if (i === 1){ m.pts.mc = m.mc.length === 1 ? 10 : m.mc.length === 2 ? 5 : 0; m.msg.mc = `<b class="ok">Exactly.</b> 3,600 pipes × 10 s = 600 min of its 630 family-B minutes: 95% busy. A short set-up does not help when there is almost no time left to do it in. Flexibility depends on load as much as on C/O.`; }
    else m.msg.mc = `<b class="no">${why[i]}</b>`; render(); });
  if (m.step === 4) app.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { m.view = +b.dataset.view; render(); });
}

      <div id="labout" class="stack"></div>${LEGEND}
    </section><section class="labgrid">${L.st.map((s, i) => `<div class="panel stack" style="gap:8px"><h3>${s.name}</h3>
      <label class="sl"><span class="row"><span>C/O</span><b class="num" data-v="co-${i}"></b></span><input type="range" data-k="co" data-i="${i}" min="0" max="${Math.max(30, base.stages[i].co * 1.5)}" step="${base.stages[i].co > 20 ? 1 : 0.1}" value="${s.co}"></label>
      <label class="sl"><span class="row"><span>Availability</span><b class="num" data-v="a-${i}"></b></span><input type="range" data-k="a" data-i="${i}" min="0.6" max="1" step="0.01" value="${s.a}"></label>
      ${L.key === 'B' ? `<label class="sl"><span class="row"><span>Share for this family</span><b class="num" data-v="share-${i}"></b></span><input type="range" data-k="share" data-i="${i}" min="0.3" max="1" step="0.05" value="${s.share}"></label>` : ''}
      <span class="muted num" style="font-size:.78rem" data-info="${i}"></span></div>`).join('')}</section></div></div>`;
  const $ = id => document.getElementById(id);
  $('home').onclick = () => { S.screen = 'home'; render(); };
  $('case').onchange = e => { S.lab = { key:e.target.value, target:1, st:null }; render(); };
  $('rst').onclick = () => { S.lab = { key:L.key, target:1, st:null }; render(); };
  $('tg').oninput = e => { L.target = +e.target.value; updateLab(); };
  app.querySelectorAll('input[data-k]').forEach(inp => inp.oninput = () => { L.st[+inp.dataset.i][inp.dataset.k] = +inp.value; updateLab(); });
  updateLab();
}
function updateLab(){
  const L = S.lab, base = L.key === 'A' ? CASE_A : CASE_B;
  const ms = L.st.map(s => metrics(s, base.D, base.n, L.target));
  const worst = ms.reduce((w, m, i) => (m.epe > ms[w].epe ? i : w), 0);
  const comp = ms[worst].epe;
  document.getElementById('tgv').textContent = f2(L.target);
  L.st.forEach((s, i) => {
    const set = (k, t) => { const el = app.querySelector(`[data-v="${k}-${i}"]`); if (el) el.textContent = t; };
    set('co', f1(s.co) + ' min'); set('a', pct(s.a)); set('share', pct(s.share));
    app.querySelector(`[data-info="${i}"]`).textContent = ms[i].free > 0
      ? `left for set-ups ${f1(ms[i].free)} min · max C/O for the target ${f2(ms[i].free * L.target / base.n)} min`
      : 'production alone does not fit in the available time';
  });
  document.getElementById('labout').innerHTML =
    barsHTML(L.st.map((s, i) => ({ st:s, m:ms[i], note: ms[i].free <= 0 ? '<b class="no">not capable: production does not fit</b>'
      : s.co ? `EPE ${epeTxt(ms[i])}${ms[i].overflow > 0 ? ` · <b class="no">${f0(ms[i].overflow)} min short</b>` : ' · <b class="ok">fits</b>'}` : 'no set-up' })))
    + `<div class="msg ${isFinite(comp) && comp <= L.target + 1e-9 ? 'ok' : 'no'}">Company EPE: <b>${comp === 0 ? '1 day' : isFinite(comp) ? f2(comp) + ' days (' + Math.ceil(comp - 1e-6) + ' whole days)' : 'not capable'}</b>${comp ? ', set by ' + L.st[worst].name : ''}.</div>`;
}

/* ---------------------------------------------------------------- router */
function render(){
  if (S.screen === 'q1') renderQ1();
  else if (S.screen === 'm1') renderM1();
  else if (S.screen === 'm2') renderM2();
  else if (S.screen === 'lab') renderLab();
  else renderHome();
}
render();
</script>
</body>
</html>
